<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8-Direction ASCII Roguelike</title>

    <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 3fr 1fr;
      gap: 4px;
      height: 100vh;
      padding: 4px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
    }

    .panel {
      border: 1px solid #444;
      padding: 4px;
      overflow: auto;
      background: #222;
    }

    #canvas {
      width: 100%;
      height: 100%;
      border: 1px solid cyan;
      display: block;
    }


    #debug { border-color: #ff00ff; }
    #info1 { border-color: #00ff00; }
    #info2 { border-color: #ff9900; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🌟</text></svg>">

</head>
<body>
  <div class="grid" id="grid">
    <canvas id="canvas"></canvas>
    <div id="debug" class="panel">Debug Panel</div>
    <div id="info1" class="panel">Info Panel 1</div>
    <div id="info2" class="panel">Info Panel 2</div>
  </div>

  <script src="./game.js" type="module" defer></script>
</body>
</html>
