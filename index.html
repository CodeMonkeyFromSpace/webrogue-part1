<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8-Direction ASCII Roguelike</title>

    <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 3fr 1fr;
      gap: 4px;
      height: 100vh;
      padding: 4px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
    }

    .panel {
      border: 3px solid #0FF;
      border-radius: 8px;
      padding: 4px;
      overflow: auto;
      background: #222;
    }

    #lowerLeft {
      grid-column: 1 / 2;
      grid-row: 2 / 2;
    }

    #lowerRight {
      grid-column: 2 / 2;
      grid-row: 2 / 2;

    }

    #upperRight {
      grid-column: 2 / 2;
      grid-row: 1 / 2;
    }

    #canvasDiv {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }

    #canvas {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🌟</text></svg>">

</head>
<body>
  <div class="grid" id="grid">
    <div id="canvasDiv">
      <canvas id="canvas" class="panel"></canvas>
    </div>
    <div id="debug" class="panel">Debug Panel</div>
    <div id="info1" class="panel">Info Panel 1</div>
    <div id="info2" class="panel">Info Panel 2</div>
  </div>

  <script src="./game.js" type="module" defer></script>
</body>
</html>
